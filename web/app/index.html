<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FilmPen</title>
<style>
  :root {
    --bg: #121110; --panel: #1c1a18; --line: #2e2a26; --text: #ede7df;
    --muted: #9a9087; --accent: #e8a33d; --ok: #7cc47f; --bad: #d9705b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(18,17,16,.94);
           backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .top { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .04em; }
  h1 span { color: var(--accent); }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; min-width: 0; }
  .status .msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.wait { background: var(--accent); }
  .roll { margin-top: 10px; display: flex; gap: 8px; align-items: center; overflow-x: auto; padding-bottom: 2px; }
  .roll label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; flex: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--text);
          padding: 7px 12px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px; }
  .chip.sel { border-color: var(--accent); color: var(--accent); }
  .chip:disabled { opacity: .5; cursor: default; }
  .opts { margin-top: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
          font-size: 13px; color: var(--muted); }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--line);
           border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 13px; }
  .busy { font-size: 12px; color: var(--accent); margin-top: 6px; min-height: 16px; }
  main { padding: 16px; }
  .drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 36px 16px; text-align: center;
          color: var(--muted); cursor: pointer; margin-bottom: 16px; transition: border-color .15s, background .15s; }
  .drop.over, .drop:hover { border-color: var(--accent); background: rgba(232,163,61,.05); }
  .drop b { color: var(--text); }
  .drop small { display: block; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .card { position: relative; aspect-ratio: 4/3; background: var(--panel); border-radius: 6px;
          overflow: hidden; cursor: pointer; border: 1px solid var(--line); }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card.pending img { opacity: .35; filter: grayscale(1); }
  .badge { position: absolute; left: 6px; bottom: 6px; font-size: 11px; padding: 2px 7px;
           border-radius: 4px; background: rgba(0,0,0,.6); color: var(--text); max-width: calc(100% - 12px);
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge.err { color: var(--bad); }
  .actions { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .note { color: var(--muted); font-size: 12px; text-align: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
  .note a { color: var(--accent); }
  /* viewer */
  .viewer { position: fixed; inset: 0; background: rgba(8,8,7,.97); z-index: 10; display: none; flex-direction: column; }
  .viewer.open { display: flex; }
  .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
           padding: 12px; position: relative; user-select: none; -webkit-user-select: none; touch-action: none; }
  .stage img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 3px; -webkit-touch-callout: none; }
  .hint { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 12px;
          color: var(--muted); background: rgba(0,0,0,.5); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .bar { border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
         display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar .spacer { flex: 1; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit;
         padding: 8px 14px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; }
  .btn.primary { background: var(--accent); color: #1a1208; border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: default; }
  .close { position: absolute; top: 10px; right: 12px; z-index: 2; }
  .desc { width: 100%; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Film<span>Pen</span></h1>
    <div class="status"><span class="dot wait" id="dot"></span><span class="msg" id="msg">Loading engine…</span></div>
  </div>
  <div class="roll" id="roll"><label>Loaded film</label></div>
  <div class="opts">
    <label for="size">Size</label>
    <select id="size">
      <option value="2048" selected>2048 px (fast)</option>
      <option value="3072">3072 px</option>
      <option value="0">Full size (slow)</option>
    </select>
  </div>
  <div class="busy" id="busy"></div>
</header>
<main>
  <div class="drop" id="drop" role="button" tabindex="0">
    <b>Drop JPEGs here</b> or tap to choose
    <small>They are developed in your browser and never uploaded anywhere.</small>
  </div>
  <div class="actions" id="actions" hidden>
    <button class="btn primary" id="zip">Download all (.zip)</button>
    <button class="btn" id="clear">Clear</button>
  </div>
  <div class="grid" id="grid"></div>
  <p class="note">
    Looks from the <a href="https://github.com/dferreiramarques/filmpen">FilmPen</a> project.
    The desktop app can also fetch photos straight from the camera over Wi-Fi.
  </p>
  <input type="file" id="file" accept="image/jpeg" multiple hidden>
</main>

<div class="viewer" id="viewer">
  <button class="btn close" id="close">Close</button>
  <div class="stage" id="stage">
    <img id="img" alt="">
    <div class="hint">Hold the photo to see the original</div>
  </div>
  <div class="bar">
    <div class="desc" id="desc"></div>
    <button class="btn" id="prev">‹</button>
    <button class="btn" id="next">›</button>
    <span class="spacer"></span>
    <a class="btn primary" id="save" download>Save</a>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
        integrity="sha512-XMVd28F1oH/O71fzwBnV7HucLxVwtxf26XV8P4wPk26EDxuGZ91N8bsOttmnomcCD3CS5ZMRL50H0GgOHvegtg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
const $ = (id) => document.getElementById(id);
const worker = new Worker("worker.js");

let looks = [], look = null, ready = false;
let gen = 0, nextId = 1, running = false;
const items = []; // {id, file, orig, url, state: pending|busy|done|error, name, error}

const setStatus = (msg, cls) => { $("msg").textContent = msg; $("dot").className = "dot " + (cls || ""); };

worker.onmessage = (e) => {
  const m = e.data;
  if (m.type === "ready") {
    looks = m.looks; look = looks[0].key; ready = true;
    renderRoll(); setStatus("Ready", "on"); pump();
  } else if (m.type === "fatal") {
    setStatus("Engine failed to load", ""); $("busy").textContent = m.message;
  } else if (m.type === "done" || m.type === "error") {
    running = false;
    const it = items.find((i) => i.id === m.id);
    if (it && m.gen === gen) {
      if (m.type === "done") {
        if (it.url) URL.revokeObjectURL(it.url);
        it.url = URL.createObjectURL(new Blob([m.bytes], { type: "image/jpeg" }));
        it.state = "done";
      } else { it.state = "error"; it.error = m.message; }
      renderGrid(); if (viewerIndex >= 0) showViewer();
    }
    pump();
  }
};

function maxSize() { return parseInt($("size").value, 10); }

function pump() {
  if (!ready || running) return;
  const it = items.find((i) => i.state === "pending");
  const left = items.filter((i) => i.state === "pending" || i.state === "busy").length;
  if (!it) { $("busy").textContent = ""; return; }
  running = true; it.state = "busy";
  $("busy").textContent = `Developing ${items.length - left + 1} of ${items.length}…`;
  renderGrid();
  it.file.arrayBuffer().then((buf) =>
    worker.postMessage({ type: "develop", id: it.id, gen, buf, name: it.name, look, maxSize: maxSize() }, [buf]));
}

function restart() {
  gen++; running = false; // results of the previous generation are ignored
  for (const it of items) it.state = "pending";
  renderGrid(); pump();
}

function addFiles(files) {
  for (const f of files) {
    if (!/jpe?g$/i.test(f.name) && f.type !== "image/jpeg") continue;
    items.push({ id: nextId++, file: f, name: f.name, orig: URL.createObjectURL(f), url: null, state: "pending" });
  }
  renderGrid(); pump();
}

function renderRoll() {
  const roll = $("roll");
  roll.querySelectorAll(".chip").forEach((c) => c.remove());
  for (const l of looks) {
    const b = document.createElement("button");
    b.className = "chip" + (l.key === look ? " sel" : "");
    b.textContent = l.name; b.title = l.description;
    b.onclick = () => { if (look === l.key) return; look = l.key; renderRoll(); restart(); };
    roll.appendChild(b);
  }
}

function renderGrid() {
  const grid = $("grid");
  grid.replaceChildren();
  items.forEach((it, i) => {
    const c = document.createElement("div");
    c.className = "card" + (it.state === "done" ? "" : " pending");
    const img = document.createElement("img");
    img.src = it.state === "done" ? it.url : it.orig; img.loading = "lazy"; img.alt = it.name;
    const b = document.createElement("div");
    b.className = "badge" + (it.state === "error" ? " err" : "");
    b.textContent = it.state === "done" ? it.name : it.state === "error" ? "Failed: " + it.error
                  : it.state === "busy" ? "Developing…" : "Waiting…";
    c.append(img, b);
    c.onclick = () => { if (it.state === "done") openViewer(i); };
    grid.appendChild(c);
  });
  $("actions").hidden = items.length === 0;
  $("zip").disabled = !items.some((i) => i.state === "done");
}

// ---- viewer ----
let viewerIndex = -1;
const doneIdx = () => items.map((it, i) => (it.state === "done" ? i : -1)).filter((i) => i >= 0);
function openViewer(i) { viewerIndex = i; $("viewer").classList.add("open"); showViewer(); }
function showViewer() {
  const it = items[viewerIndex]; if (!it || it.state !== "done") return;
  const l = looks.find((x) => x.key === look);
  $("img").src = it.url;
  $("desc").textContent = `${it.name} — ${l ? l.name : ""}`;
  const s = $("save"); s.href = it.url; s.download = outName(it.name);
}
function step(d) {
  const d_ = doneIdx(); const p = d_.indexOf(viewerIndex);
  if (p < 0) return; viewerIndex = d_[(p + d + d_.length) % d_.length]; showViewer();
}
const outName = (n) => n.replace(/\.[^.]+$/, "") + "_" + look + ".jpg";
const showOrig = (on) => { const it = items[viewerIndex]; if (it) $("img").src = on ? it.orig : it.url; };
$("stage").addEventListener("pointerdown", () => showOrig(true));
["pointerup", "pointercancel", "pointerleave"].forEach((ev) => $("stage").addEventListener(ev, () => showOrig(false)));
$("close").onclick = () => { viewerIndex = -1; $("viewer").classList.remove("open"); };
$("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
addEventListener("keydown", (e) => {
  if (viewerIndex < 0) return;
  if (e.key === "Escape") $("close").click();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

// ---- input ----
const drop = $("drop");
drop.onclick = () => $("file").click();
drop.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } };
$("file").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };
["dragenter", "dragover"].forEach((ev) => addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
addEventListener("drop", (e) => addFiles(e.dataTransfer.files));
$("size").onchange = () => { if (items.length) restart(); };

$("clear").onclick = () => {
  gen++; running = false;
  for (const it of items) { URL.revokeObjectURL(it.orig); if (it.url) URL.revokeObjectURL(it.url); }
  items.length = 0; $("busy").textContent = ""; renderGrid();
};
$("zip").onclick = async () => {
  const zip = new JSZip();
  for (const it of items) if (it.state === "done") zip.file(outName(it.name), await (await fetch(it.url)).blob());
  const a = document.createElement("a");
  a.href = URL.createObjectURL(await zip.generateAsync({ type: "blob" }));
  a.download = `filmpen_${look}.zip`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
};
</script>
</body>
</html>
